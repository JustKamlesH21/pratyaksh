# What the Voice Agent may say when a Caller asks a question (not a Request).
# Keep answers short, general and true for any bank. Never put account data, rates or numbers
# that change here. A matched answer is spoken as written; the LLM uses all of them as its facts
# for anything the keywords miss.
#
# answer / answer_hi / answer_kn: the same answer in English, Hindi and Kannada. The Caller gets
#   the one in the language they spoke (language.language_of). Write Hindi and Kannada in native
#   script, loanwords too (ऐप, ಆ್ಯಪ್), and numbers as words, so the voice can read them. The Hindi
#   voice speaks as a man (Aman) ("कर सकता हूँ"). When an answer tells the Caller what to say, use
#   words the Interpreter understands ("ऐप से करना है", "ಆ್ಯಪ್ ಮೂಲಕ ಮಾಡಿ").
# keywords: an entry matches when all words of one keyword appear, in any order. Words of four
#   letters or more also match longer words ("record" matches "recorded"); end a shorter word
#   with * to match it as a stem. Rare words count for more, so "ifsc code" beats "what code".
#   Add Kannada and Hindi keywords in native script and romanised; speech-to-text gives either.
# during: whisper_phrase | possession_code — only while the Caller is answering that Challenge.
#   These win there, even when the Caller does not phrase them as a question.
# small_talk: true — greetings, thanks, "what can you do"; never preferred over a Request.
# report: true — the Caller is reporting a problem (fraud, a failed payment); answered even when it
#   mentions a Request ("someone transferred money from my account" is not a transfer Request).

# --- about Verification -----------------------------------------------------------------
- id: why_verify
  keywords: [why verify, verify me, why verification, why check, why checks, why security, why so many questions,
             kyon verify, verify kyon, verify yake, ಯಾಕೆ ಪರಿಶೀಲನೆ, ಪರಿಶೀಲನೆ ಯಾಕೆ, क्यों वेरिफाई, जाँच क्यों]
  answer: >-
    Voice-cloning tools can now copy anyone's voice from a short clip. So for risky requests I check that a live
    person holding your registered phone is on the line. It takes a few seconds, and I never store your voice.
  answer_hi: >-
    आजकल आवाज़ की नकल करने वाले टूल किसी की भी आवाज़ एक छोटी सी रिकॉर्डिंग से कॉपी कर लेते हैं। इसलिए जोखिम वाले
    कामों के लिए मैं जाँचती हूँ कि लाइन पर आपका रजिस्टर्ड फ़ोन लिए कोई असली इंसान है। इसमें कुछ ही सेकंड लगते हैं,
    और मैं आपकी आवाज़ कभी सेव नहीं करता।
  answer_kn: >-
    ಈಗ ಧ್ವನಿ ನಕಲು ಮಾಡುವ ಉಪಕರಣಗಳು ಒಂದು ಸಣ್ಣ ರೆಕಾರ್ಡಿಂಗ್‌ನಿಂದಲೇ ಯಾರ ಧ್ವನಿಯನ್ನಾದರೂ ನಕಲು ಮಾಡಬಲ್ಲವು. ಅದಕ್ಕೇ
    ಅಪಾಯವಿರುವ ಕೆಲಸಗಳಿಗೆ, ನಿಮ್ಮ ನೋಂದಾಯಿತ ಫೋನ್ ಹಿಡಿದಿರುವ ನಿಜವಾದ ವ್ಯಕ್ತಿ ಲೈನ್‌ನಲ್ಲಿ ಇದ್ದಾರೆಯೇ ಎಂದು ನಾನು
    ಪರಿಶೀಲಿಸುತ್ತೇನೆ. ಇದಕ್ಕೆ ಕೆಲವೇ ಸೆಕೆಂಡ್ ಸಾಕು, ಮತ್ತು ನಾನು ನಿಮ್ಮ ಧ್ವನಿಯನ್ನು ಎಂದಿಗೂ ಉಳಿಸಿಕೊಳ್ಳುವುದಿಲ್ಲ.
- id: why_whisper
  keywords: [why whisper, whisper kyon, whisper kyu, why should i whisper, what is this whisper, whisper yake,
             ಯಾಕೆ ಪಿಸುಮಾತು, ಪಿಸುಮಾತು ಯಾಕೆ, फुसफुसा]
  answer: &why_whisper >-
    Whispering a random phrase is easy for a person and very hard for a voice-cloning tool.
    It lets us confirm a live person is on the line without storing your voice.
  answer_hi: &why_whisper_hi >-
    किसी इंसान के लिए कोई रैंडम वाक्य फुसफुसाना आसान है, लेकिन आवाज़ की नकल करने वाले टूल के लिए बहुत मुश्किल।
    इससे हम आपकी आवाज़ सेव किए बिना पक्का कर पाते हैं कि लाइन पर कोई असली इंसान है।
  answer_kn: &why_whisper_kn >-
    ಯಾವುದೋ ಒಂದು ವಾಕ್ಯವನ್ನು ಪಿಸುಗುಟ್ಟುವುದು ಮನುಷ್ಯರಿಗೆ ಸುಲಭ, ಆದರೆ ಧ್ವನಿ ನಕಲು ಮಾಡುವ ಉಪಕರಣಕ್ಕೆ ತುಂಬಾ ಕಷ್ಟ.
    ಇದರಿಂದ ನಿಮ್ಮ ಧ್ವನಿಯನ್ನು ಉಳಿಸಿಕೊಳ್ಳದೆಯೇ ಲೈನ್‌ನಲ್ಲಿ ನಿಜವಾದ ವ್ಯಕ್ತಿ ಇದ್ದಾರೆ ಎಂದು ನಾವು ಖಚಿತಪಡಿಸಿಕೊಳ್ಳುತ್ತೇವೆ.
- id: why_this_whisper
  during: whisper_phrase
  keywords: [why, why asking, why this, kyon, kyu, yake, ಯಾಕೆ, क्यों]
  answer: *why_whisper
  answer_hi: *why_whisper_hi
  answer_kn: *why_whisper_kn
- id: how_to_whisper
  during: whisper_phrase
  keywords: [how whisper, how do i whisper, louder, loud, speak up, normal voice, normally, whisper or talk,
             whisper kaise, kaise bolu, hege whisper, hege helali, ಹೇಗೆ ಹೇಳಲಿ, ಪಿಸುಮಾತು ಹೇಗೆ, कैसे बोलूं, कैसे फुसफुसा,
             ज़ोर से]
  answer: >-
    Whispering means saying the words very softly, without using your voice, as if telling someone a secret.
    Keep the phone close to your mouth.
  answer_hi: >-
    फुसफुसाने का मतलब है शब्दों को बहुत धीरे, बिना आवाज़ निकाले बोलना, जैसे किसी को राज़ की बात बता रहे हों।
    फ़ोन को मुँह के पास रखिए।
  answer_kn: >-
    ಪಿಸುಗುಟ್ಟುವುದು ಎಂದರೆ, ಯಾರಿಗೋ ಗುಟ್ಟು ಹೇಳುವಂತೆ, ಧ್ವನಿ ಬಳಸದೆ ಪದಗಳನ್ನು ತುಂಬಾ ಮೆಲ್ಲಗೆ ಹೇಳುವುದು.
    ಫೋನನ್ನು ಬಾಯಿಯ ಹತ್ತಿರ ಇಟ್ಟುಕೊಳ್ಳಿ.
- id: why_code
  keywords: [why code, what code, which code, where is the code, code kahan, code kidhar, code elli, ಕೋಡ್ ಎಲ್ಲಿ,
             ಯಾವ ಕೋಡ್, कोड कहाँ, कौन सा कोड,
             # asked on a real Call (Oct 27): "From where to read the OTP?"
             where otp, find code, find the code, where code, read otp, otp kahan, otp kidhar, otp elli,
             ಒಟಿಪಿ ಎಲ್ಲಿ, ओटीपी कहाँ]
  answer: &why_code >-
    We send a six-digit code to the bank app on your registered phone. Reading it out shows that
    the person calling also has your phone. The code is valid for two minutes.
  answer_hi: &why_code_hi >-
    हम आपके रजिस्टर्ड फ़ोन के बैंक ऐप में छह अंकों का एक कोड भेजते हैं। उसे पढ़कर सुनाने से पता चलता है कि कॉल
    करने वाले के पास आपका फ़ोन भी है। यह कोड दो मिनट तक मान्य रहता है।
  answer_kn: &why_code_kn >-
    ನಿಮ್ಮ ನೋಂದಾಯಿತ ಫೋನ್‌ನ ಬ್ಯಾಂಕ್ ಆ್ಯಪ್‌ಗೆ ನಾವು ಆರು ಅಂಕಿಯ ಕೋಡ್ ಕಳುಹಿಸುತ್ತೇವೆ. ಅದನ್ನು ಓದಿ ಹೇಳಿದರೆ, ಕರೆ
    ಮಾಡುತ್ತಿರುವವರ ಬಳಿ ನಿಮ್ಮ ಫೋನ್ ಕೂಡ ಇದೆ ಎಂದು ತಿಳಿಯುತ್ತದೆ. ಈ ಕೋಡ್ ಎರಡು ನಿಮಿಷ ಮಾನ್ಯವಾಗಿರುತ್ತದೆ.
