    That's fine. If you can, move somewhere a little quieter, hold the phone close and whisper the words.
  answer_hi: >-
    कोई बात नहीं। हो सके तो थोड़ी शांत जगह पर चले जाइए, फ़ोन पास रखिए और शब्द फुसफुसाइए।
  answer_kn: >-
    ಪರವಾಗಿಲ್ಲ. ಸಾಧ್ಯವಾದರೆ ಸ್ವಲ್ಪ ಶಾಂತವಾದ ಜಾಗಕ್ಕೆ ಹೋಗಿ, ಫೋನನ್ನು ಹತ್ತಿರ ಹಿಡಿದು ಪದಗಳನ್ನು ಪಿಸುಗುಟ್ಟಿ.
- id: how_many_digits
  during: possession_code
  keywords: [how many digits, how many numbers, how many, kitne digit, kitne number, estu digit, estu number,
             कितने अंक, ಎಷ್ಟು ಅಂಕಿ]
  answer: It's six digits. Please read them one at a time.
  answer_hi: छह अंक हैं। कृपया एक-एक करके पढ़िए।
  answer_kn: ಆರು ಅಂಕಿಗಳು. ದಯವಿಟ್ಟು ಒಂದೊಂದಾಗಿ ಓದಿ.
