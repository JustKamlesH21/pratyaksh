- id: code_scam_worry
  # Asked on a real iPhone Call (Oct 29): "मैं OTP क्यों दूँ? आप स्कैम भी हो सकते हो" (why should I give the OTP,
  # you could be a scam). A worry about this step, not a fraud report: answered here, ahead of fraud_report.
  during: possession_code
  keywords: [scam, स्कैम, fraud, फ्रॉड, fake, नकली, nakli, dhoka, धोखा, ಮೋಸ, ವಂಚನೆ, trust you, believe you,
             why should i give, why give, should i give, how do i know you, kyun du*, kyon du*, kyu du*, kyundu,
             क्यों दूँ, क्यूँ दूँ, otp kyun*, otp kyon, otp kyu, ओटीपी क्यों, yake otp, ಯಾಕೆ ಒಟಿಪಿ, otp yake]
  answer: >-
    You are right to be careful. Never read a code to someone who called you. You called us yourself, and this code
    is not a payment OTP: it only shows that your phone is with you, for this call, and it works once. If you are
    unsure, hang up and call the number on the back of your card.
  answer_hi: >-
    आपका सावधान रहना बिल्कुल सही है। जो आपको खुद कॉल करे, उसे कभी कोई कोड मत बताइए। यह कॉल आपने खुद बैंक को की
    है, और यह कोड पेमेंट वाला ओटीपी नहीं है: यह सिर्फ़ इस कॉल के लिए, एक बार, यह दिखाता है कि आपका फ़ोन आपके पास है।
    अगर शक हो, तो फ़ोन काटिए और अपने कार्ड के पीछे लिखे नंबर पर कॉल कीजिए।
  answer_kn: >-
    ನೀವು ಎಚ್ಚರದಿಂದಿರುವುದು ಸರಿಯೇ. ನಿಮಗೆ ತಾವಾಗಿ ಕರೆ ಮಾಡಿದವರಿಗೆ ಯಾವ ಕೋಡ್ ಅನ್ನೂ ಹೇಳಬೇಡಿ. ಈ ಕರೆಯನ್ನು ನೀವೇ ಬ್ಯಾಂಕಿಗೆ
    ಮಾಡಿದ್ದೀರಿ, ಮತ್ತು ಈ ಕೋಡ್ ಪೇಮೆಂಟ್ ಒಟಿಪಿ ಅಲ್ಲ: ಇದು ಈ ಕರೆಗೆ ಮಾತ್ರ, ಒಂದೇ ಬಾರಿ, ನಿಮ್ಮ ಫೋನ್ ನಿಮ್ಮ ಬಳಿಯೇ ಇದೆ
    ಎಂದು ತೋರಿಸುತ್ತದೆ. ಅನುಮಾನ ಬಂದರೆ, ಕರೆ ಕಟ್ ಮಾಡಿ ನಿಮ್ಮ ಕಾರ್ಡಿನ ಹಿಂಭಾಗದಲ್ಲಿರುವ ನಂಬರ್‌ಗೆ ಕರೆ ಮಾಡಿ.
- id: code_not_received
  during: possession_code
  keywords: [not received, didn't get, did not get, not got, haven't got, haven't received, no code, not come,
             not showing, can't find, cannot find, can't see, no new, no message, nothing there, empty,
             nahi aaya, nahi aya, nahi mila, banthilla, bandilla, sigtilla, sigalilla,
             ಬಂದಿಲ್ಲ, ಸಿಕ್ಕಿಲ್ಲ, ಕೋಡ್ ಇಲ್ಲ, ಕಾಣಿಸ್ತಿಲ್ಲ, ಕಾಣಿಸುತ್ತಿಲ್ಲ, नहीं आया, नहीं मिला, दिख नहीं, कोड नहीं]
  answer: >-
    The code is in the bank app on your registered phone, not in an SMS. Open the app and it shows at the top;
    it can take a few seconds to arrive.
  answer_hi: >-
    कोड आपके रजिस्टर्ड फ़ोन के बैंक ऐप में आता है, एसएमएस में नहीं। ऐप खोलिए, कोड सबसे ऊपर दिखेगा; आने में कुछ
    सेकंड लग सकते हैं।
  answer_kn: >-
    ಕೋಡ್ ನಿಮ್ಮ ನೋಂದಾಯಿತ ಫೋನ್‌ನ ಬ್ಯಾಂಕ್ ಆ್ಯಪ್‌ನಲ್ಲಿ ಬರುತ್ತದೆ, ಎಸ್‌ಎಂಎಸ್‌ನಲ್ಲಿ ಅಲ್ಲ. ಆ್ಯಪ್ ತೆರೆಯಿರಿ, ಕೋಡ್
    ಮೇಲ್ಭಾಗದಲ್ಲಿ ಕಾಣಿಸುತ್ತದೆ; ಬರಲು ಕೆಲವು ಸೆಕೆಂಡ್ ಆಗಬಹುದು.
- id: which_app
  keywords: [which app, what app, kaunsa app, kaun sa app, yava app, ಯಾವ ಆಪ್, ಯಾವ ಆ್ಯಪ್, कौन सा ऐप]
  answer: >-
    Your bank's own app on your registered phone, the one you use for payments. The code appears there, not in an SMS.
  answer_hi: >-
    आपके रजिस्टर्ड फ़ोन पर आपके बैंक का अपना ऐप, जिससे आप पेमेंट करते हैं। कोड वहीं आता है, एसएमएस में नहीं।
  answer_kn: >-
    ನಿಮ್ಮ ನೋಂದಾಯಿತ ಫೋನ್‌ನಲ್ಲಿರುವ ನಿಮ್ಮ ಬ್ಯಾಂಕಿನ ಸ್ವಂತ ಆ್ಯಪ್, ಪೇಮೆಂಟ್ ಮಾಡಲು ನೀವು ಬಳಸುವುದು. ಕೋಡ್ ಅಲ್ಲೇ
    ಬರುತ್ತದೆ, ಎಸ್‌ಎಂಎಸ್‌ನಲ್ಲಿ ಅಲ್ಲ.
- id: two_codes
  during: possession_code
  # not "do code": English "where do I find the code" would match it
  keywords: [two codes, many codes, which one, latest code, old code, multiple codes, do code aaye, दो कोड, ಎರಡು ಕೋಡ್]
  answer: Please read the newest code, the one at the top of the bank app.
  answer_hi: कृपया सबसे नया कोड पढ़िए, जो बैंक ऐप में सबसे ऊपर है।
  answer_kn: ದಯವಿಟ್ಟು ಹೊಸ ಕೋಡ್ ಓದಿ, ಬ್ಯಾಂಕ್ ಆ್ಯಪ್‌ನಲ್ಲಿ ಮೇಲ್ಭಾಗದಲ್ಲಿರುವುದು.
- id: noisy
