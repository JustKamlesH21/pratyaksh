# Pratyaksh Policy. Banks tune this file; code reads it through pratyaksh.policy.Policy.
# Tune weights and thresholds from Eval Runs (pratyaksh-eval), not by guesswork.

requests:
  balance_enquiry:
    challenges: []
  add_payee:
    challenges: [whisper_phrase, possession_code]
  sim_swap:
    challenges: [whisper_phrase, whisper_phrase, possession_code]
  high_value_transfer:
    challenges: [whisper_phrase, whisper_phrase, possession_code]
    agent_review: true
  account_service:       # cards, limits, address, closing an account, cheque book, KYC…
    challenges: [whisper_phrase, possession_code]

signals:
  task_match:
    min: 0.70            # below this the phrase was not said
  whisper_score:
    min: 0.60            # below this the phrase was not whispered
  reply_latency:
    human_ms: 1200       # at or below: full credit
    machine_ms: 3000     # at or above: no credit
  spoof_score:
    mode: enforce        # enforce | advisory | off
    block_at: 0.85       # enforce mode: P(synthetic) at or above this is a hard fail
  code_match:
    max_digits: 8        # a readout with more digits never matches: a long run of digits would try many codes

weights:                 # combined into a Liveness Score per Response
  task_match: 0.30
  whisper_score: 0.20
  reply_latency: 0.20
  spoof_score: 0.30

verdict:
  pass_at: 0.75          # mean Liveness Score at or above: PASS
  block_at: 0.45         # at or below: BLOCK; in between: STEP-UP
  max_step_ups: 1        # extra Whisper Phrases before handing over to App Approval

protection:              # after a BLOCK, an impostor must not simply call again
  pause_minutes: 30      # risky Requests for that Customer are refused on voice until the Customer dismisses
                         # the Security Alert on their Registered Device, or this long has passed; 0 = off
  alert_hours: 24        # how long the Registered Device shows the Security Alert
  wave_customers: 3      # blocked Calls for this many different Customers within wave_minutes is an Attack
  wave_minutes: 15       # Wave (a Clone campaign): the Console warns, and every risky Request also needs Agent
                         # Review until it passes; 0 = off. (One Customer called again and again is Voice Pause's job.)
